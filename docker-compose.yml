# =============================================================================
# Incert OCSP Subsystem — Decoupled Architecture Docker Compose
# Architecture: RabbitMQ + Separated OCSP Responder + Separated OCSP Client + SoftHSM2 (PKCS#11) + KMS Simulator
# =============================================================================
# One-click startup:
#   docker compose up --build -d
#
# Services:
#   mariadb          MariaDB 10.11 (schemas: ocsp, kms) (host 3307, internal 3306)
#   rabbitmq         RabbitMQ 3.13 + Management UI      (host 5672, 15672)
#   kms-simulator    KMS & CA simulator + event outbox  (host 8090, internal 8090)
#   hsm              SoftHSM2 Dedicated HSM Container   (PKCS#11 Token & Key Module)
#   ocsp-responder   RFC 6960 OCSP Responder + Auth    (host 8080, internal 8080)
#   ocsp-client      RFC 6960 Client + Test Web UI      (host 8082, internal 8082)
#   ocsp-console     React 18 Admin Dashboard + Nginx   (host 3000)
# =============================================================================

networks:
  ocsp-net:
    driver: bridge

volumes:
  mariadb-data:
  pki-data:
  hsm-tokens:
  hsm-conf:

x-spring-opts: &spring-opts
  JAVA_OPTS: >-
    -XX:+UseContainerSupport
    -XX:MaxRAMPercentage=75.0
    -Djava.security.egd=file:/dev/./urandom

services:

  # ============================================================
  # MariaDB 10.11 (Schemas: ocsp, kms)
  # ============================================================
  mariadb:
    image: mariadb:10.11
    container_name: ocsp-mariadb
    restart: unless-stopped
    networks: [ocsp-net]
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_DATABASE:      ocsp
      MARIADB_USER:          ocsp_app
      MARIADB_PASSWORD:      changeme
    ports:
      - "3307:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 6

  # ============================================================
  # RabbitMQ with Management UI
  # ============================================================
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: ocsp-rabbitmq
    restart: unless-stopped
    networks: [ocsp-net]
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # ============================================================
  # KMS Simulator (Event Source & Test PKI Generator + Frontend)
  # ============================================================
  kms-simulator:
    build:
      context: .
      dockerfile: kms-simulator/Dockerfile
    image: ocsp/kms-simulator:local
    container_name: ocsp-kms
    restart: unless-stopped
    networks: [ocsp-net]
    depends_on:
      mariadb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8090:8090"
    environment:
      <<: *spring-opts
      MARIADB_HOST: mariadb
      MARIADB_PORT: 3306
      MARIADB_KMS_DB: kms
      MARIADB_KMS_USER: kms_app
      MARIADB_KMS_PASSWORD: changeme
      FLYWAY_USER: root
      FLYWAY_PASSWORD: rootpassword
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      KMS_PORT: 8090
      KMS_JOB_REVOCATION_ENABLED: "false"
    volumes:
      - pki-data:/data/pki
      - ./data/pki:/app/data/pki
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8090/actuator/health || exit 1"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 6

  # ============================================================
  # Dedicated SoftHSM2 Container (PKCS#11 Hardware Security Module)
  # ============================================================
  hsm:
    build:
      context: .
      dockerfile: hsm/Dockerfile
    image: ocsp/hsm:local
    container_name: ocsp-hsm
    restart: unless-stopped
    networks: [ocsp-net]
    depends_on:
      kms-simulator:
        condition: service_healthy
    environment:
      HSM_TOKEN_LABEL: ocsp-signing
      HSM_PIN: "1234"
      HSM_SO_PIN: "12345678"
      HSM_KEY_LABEL: ocsp-signing-key
      HSM_PKCS11_LIBRARY: /usr/lib/softhsm/libsofthsm2.so
      PKI_DIR: /data/pki
    volumes:
      - hsm-tokens:/var/lib/softhsm/tokens
      - hsm-conf:/etc/softhsm2
      - pki-data:/data/pki
    healthcheck:
      test: ["CMD-SHELL", "pkcs11-tool --module /usr/lib/softhsm/libsofthsm2.so --token-label ocsp-signing --login --pin 1234 --list-objects 2>/dev/null | grep -q ocsp-signing-key || exit 1"]
      start_period: 15s
      interval: 5s
      timeout: 5s
      retries: 6

  # ============================================================
  # OCSP Responder (RFC 6960 Responder + PKCS#11 via application.properties)
  # ============================================================
  ocsp-responder:
    build:
      context: .
      dockerfile: ocsp-responder/Dockerfile
    image: ocsp/responder:local
    container_name: ocsp-responder
    restart: unless-stopped
    networks: [ocsp-net]
    depends_on:
      mariadb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      hsm:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      <<: *spring-opts
      MARIADB_HOST: mariadb
      MARIADB_PORT: 3306
      MARIADB_DB: ocsp
      MARIADB_USER: ocsp_app
      MARIADB_PASSWORD: changeme
      FLYWAY_USER: root
      FLYWAY_PASSWORD: rootpassword
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      KMS_HOST: kms-simulator
      KMS_PORT: 8090
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: changeme
      ADMIN_API_KEY: incert-admin-secret-key
      AUTH_MODE: ${AUTH_MODE:-KEYCLOCK}
      KEYCLOAK_URL: ${KEYCLOAK_URL:-http://localhost:8081}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-incert}
      KEYCLOAK_JWK_SET_URI: ${KEYCLOAK_JWK_SET_URI:-http://keycloak:8081/realms/incert/protocol/openid-connect/certs}
      HSM_ENABLED: "true"
      HSM_PKCS11_LIBRARY: /usr/lib/softhsm/libsofthsm2.so
      HSM_TOKEN_LABEL: ocsp-signing
      HSM_PIN: "1234"
      HSM_KEY_LABEL: ocsp-signing-key
      SOFTHSM2_CONF: /etc/softhsm2/softhsm2.conf
      PKI_DIR: /data/pki
    volumes:
      - hsm-tokens:/var/lib/softhsm/tokens
      - hsm-conf:/etc/softhsm2
      - pki-data:/data/pki:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      start_period: 40s
      interval: 10s
      timeout: 5s
      retries: 6

  # ============================================================
  # OCSP Client (RFC 6960 Client + Web Test Interface)
  # ============================================================
  ocsp-client:
    build:
      context: .
      dockerfile: ocsp-client/Dockerfile
    image: ocsp/client:local
    container_name: ocsp-client
    restart: unless-stopped
    networks: [ocsp-net]
    depends_on:
      ocsp-responder:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      <<: *spring-opts
      SERVER_PORT: 8082
      OCSP_RESPONDER_URL: http://ocsp-responder:8080/ocsp
      PKI_DIR: /data/pki
    volumes:
      - pki-data:/data/pki
      - ./data/pki:/app/data/pki
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8082/actuator/health || exit 1"]
      start_period: 25s
      interval: 10s
      timeout: 5s
      retries: 6

  # ============================================================
  # OCSP Admin Console (React 18 SPA via Nginx)
  # ============================================================
  ocsp-console:
    build:
      context: ./ocsp-console
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
        VITE_AUTH_BASE_URL: ""
    image: ocsp/console:local
    container_name: ocsp-console
    restart: unless-stopped
    networks: [ocsp-net]
    depends_on:
      ocsp-responder:
        condition: service_healthy
      ocsp-client:
        condition: service_healthy
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/ || exit 1"]
      start_period: 15s
      interval: 10s
      timeout: 5s
      retries: 4

  # ============================================================
  # Keycloak IAM Service (OAuth2 / OIDC Provider for KEYCLOCK mode)
  # ============================================================
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: ocsp-keycloak
    restart: unless-stopped
    networks: [ocsp-net]
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8081
    ports:
      - "8081:8081"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8081 && echo -e 'GET /realms/incert HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK' || exit 1"]
      start_period: 35s
      interval: 10s
      timeout: 5s
      retries: 8
