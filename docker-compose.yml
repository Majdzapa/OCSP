# =============================================================================
# Incert OCSP Subsystem — Re-architected Full-stack Docker Compose
# Architecture: Kafka (KRaft) + Spring Modulith (ocsp-app) + SoftHSM2 (PKCS#11) + KMS Simulator
# =============================================================================
# One-click startup:
#   docker compose up --build -d
#
# Services (5 services total):
#   mariadb          MariaDB 10.11 (schemas: ocsp, kms) (host 3307, internal 3306)
#   kafka            Apache Kafka 3.8 / KRaft mode      (host 9092, internal 9092)
#   kms-simulator    KMS & CA simulator + event outbox  (host 8090, internal 8090)
#   ocsp-app         Modular OCSP responder (Modulith)  (host 8080, internal 8080)
#   ocsp-console     React 18 Admin Dashboard + Nginx   (host 3000)
# =============================================================================

networks:
  ocsp-net:
    driver: bridge

volumes:
  mariadb-data:
  pki-data:

x-spring-opts: &spring-opts
  JAVA_OPTS: >-
    -XX:+UseContainerSupport
    -XX:MaxRAMPercentage=75.0
    -Djava.security.egd=file:/dev/./urandom

services:

  # ============================================================
  # MariaDB 10.11 (Schemas: ocsp, kms)
  # ============================================================
  mariadb:
    image: mariadb:10.11
    container_name: ocsp-mariadb
    restart: unless-stopped
    networks: [ocsp-net]
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_DATABASE:      ocsp
      MARIADB_USER:          ocsp_app
      MARIADB_PASSWORD:      changeme
    ports:
      - "3307:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 6

  # ============================================================
  # Kafka in KRaft mode (No ZooKeeper)
  # ============================================================
  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: ocsp-kafka
    restart: unless-stopped
    networks: [ocsp-net]
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/9092' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ============================================================
  # KMS Simulator (Event Source & Test PKI Generator)
  # ============================================================
  kms-simulator:
    build:
      context: .
      dockerfile: kms-simulator/Dockerfile
    image: ocsp/kms-simulator:local
    container_name: ocsp-kms
    restart: unless-stopped
    networks: [ocsp-net]
    depends_on:
      mariadb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8090:8090"
    environment:
      <<: *spring-opts
      MARIADB_HOST: mariadb
      MARIADB_PORT: 3306
      MARIADB_KMS_DB: kms
      MARIADB_KMS_USER: kms_app
      MARIADB_KMS_PASSWORD: changeme
      FLYWAY_USER: root
      FLYWAY_PASSWORD: rootpassword
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KMS_PORT: 8090
      KMS_JOB_REVOCATION_ENABLED: "false"
    volumes:
      - pki-data:/data/pki
      - ./data/pki:/app/data/pki
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8090/actuator/health || exit 1"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 6

  # ============================================================
  # OCSP App (Modular Monolith with Spring Modulith & SoftHSM2)
  # ============================================================
  ocsp-app:
    build:
      context: .
      dockerfile: ocsp-app/Dockerfile
    image: ocsp/app:local
    container_name: ocsp-app
    restart: unless-stopped
    networks: [ocsp-net]
    depends_on:
      mariadb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kms-simulator:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      <<: *spring-opts
      MARIADB_HOST: mariadb
      MARIADB_PORT: 3306
      MARIADB_DB: ocsp
      MARIADB_USER: ocsp_app
      MARIADB_PASSWORD: changeme
      FLYWAY_USER: root
      FLYWAY_PASSWORD: rootpassword
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      HSM_ENABLED: "true"
      HSM_PKCS11_LIBRARY: /usr/lib/softhsm/libsofthsm2.so
      HSM_TOKEN_LABEL: ocsp-signing
      HSM_PIN: "1234"
      HSM_KEY_LABEL: ocsp-signing-key
      PKI_DIR: /data/pki
    volumes:
      - pki-data:/data/pki
      - ./data/pki:/app/data/pki
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      start_period: 40s
      interval: 10s
      timeout: 5s
      retries: 6

  # ============================================================
  # OCSP Admin Console (React 18 SPA via Nginx)
  # ============================================================
  ocsp-console:
    build:
      context: ./ocsp-console
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
        VITE_AUTH_BASE_URL: ""
    image: ocsp/console:local
    container_name: ocsp-console
    restart: unless-stopped
    networks: [ocsp-net]
    depends_on:
      ocsp-app:
        condition: service_healthy
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/ || exit 1"]
      start_period: 15s
      interval: 10s
      timeout: 5s
      retries: 4
