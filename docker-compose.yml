# =============================================================================
# Incert OCSP Subsystem — Decoupled Architecture Docker Compose
# Architecture: RabbitMQ + Separated OCSP Responder + Separated OCSP Client + SoftHSM2 (PKCS#11)
# KMS is deployed separately as an external system publishing events via RabbitMQ.
# =============================================================================
# One-click startup:
#   docker compose up --build -d
#
# Services:
#   mariadb          MariaDB 10.11 (schema: ocsp)       (host 3307, internal 3306)
#   rabbitmq         RabbitMQ 3.13 + Management UI      (host 5672, 15672)
#   hsm              SoftHSM2 Dedicated HSM Container   (PKCS#11 Tokens: ocsp-signing, ocsp-signing-2)
#   ocsp-responder   Unified OCSP Responder, Client & Admin Console UI (host 8080 & 3002 -> internal 8080)
# =============================================================================

networks:
  ocsp-net:
    name: ocsp-net
    driver: bridge

volumes:
  mariadb-data:
  hsm-tokens:
  hsm-conf:

x-spring-opts: &spring-opts
  JAVA_OPTS: >-
    -XX:+UseContainerSupport
    -XX:MaxRAMPercentage=75.0
    -Djava.security.egd=file:/dev/./urandom

services:

  # ============================================================
  # MariaDB 10.11 (Schemas: ocsp, kms)
  # ============================================================
  mariadb:
    image: mariadb:10.11
    container_name: ocsp-mariadb
    restart: unless-stopped
    networks: [ocsp-net]
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-rootpassword}
      MARIADB_DATABASE:      ocsp
      MARIADB_USER:          ocsp_app
      MARIADB_PASSWORD:      ${MARIADB_PASSWORD:-changeme}
    ports:
      - "3307:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 6

  # ============================================================
  # RabbitMQ with Management UI (AMQPS 5671 mTLS & Plaintext 5672)
  # ============================================================
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: ocsp-rabbitmq
    restart: unless-stopped
    networks: [ocsp-net]
    ports:
      - "5671:5671"
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-ocsp_amqp}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-changeme}
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./certs/rabbitmq:/etc/rabbitmq/certs:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # ============================================================
  # Dedicated SoftHSM2 Container (PKCS#11 Hardware Security Module)
  # ============================================================
  hsm:
    build:
      context: .
      dockerfile: hsm/Dockerfile
    image: ocsp/hsm:local
    container_name: ocsp-hsm
    restart: unless-stopped
    networks: [ocsp-net]
    environment:
      HSM_TOKEN_LABEL: ${HSM_TOKEN_LABEL:-ocsp-signing}
      HSM_SECONDARY_TOKEN_LABEL: ${HSM_SECONDARY_TOKEN_LABEL:-ocsp-signing-2}
      HSM_PIN: ${HSM_PIN:-1234}
      HSM_SO_PIN: ${HSM_SO_PIN:-12345678}
      HSM_PKCS11_LIBRARY: /usr/lib/softhsm/libsofthsm2.so
    volumes:
      - hsm-tokens:/var/lib/softhsm/tokens
      - hsm-conf:/etc/softhsm2
    healthcheck:
      test: ["CMD-SHELL", "softhsm2-util --show-slots | grep -q 'Label:.*ocsp-signing' && softhsm2-util --show-slots | grep -q 'Label:.*ocsp-signing-2' || exit 1"]
      start_period: 15s
      interval: 5s
      timeout: 5s
      retries: 6

  # ============================================================
  # OCSP Responder (RFC 6960 Responder + In-Process PKCS11J Multi-Device)
  # ============================================================
  ocsp-responder:
    build:
      context: .
      dockerfile: ocsp-responder/Dockerfile
    image: ocsp/responder:local
    container_name: ocsp-responder
    restart: unless-stopped
    networks: [ocsp-net]
    depends_on:
      mariadb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      hsm:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    ports:
      - "8080:8080"
      - "3002:8080"
    environment:
      <<: *spring-opts
      MARIADB_HOST: mariadb
      MARIADB_PORT: 3306
      MARIADB_DB: ocsp
      MARIADB_USER: ocsp_app
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-changeme}
      FLYWAY_USER: root
      FLYWAY_PASSWORD: ${MARIADB_ROOT_PASSWORD:-rootpassword}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5671}
      RABBITMQ_TLS_ENABLED: ${RABBITMQ_TLS_ENABLED:-true}
      RABBITMQ_SSL_ENABLED: ${RABBITMQ_TLS_ENABLED:-true}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-ocsp_amqp}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-changeme}
      RABBITMQ_SSL_KEYSTORE: file:/certs/rabbitmq/client-keystore.p12
      RABBITMQ_SSL_KEYSTORE_PASSWORD: ${RABBITMQ_SSL_KEYSTORE_PASSWORD:-changeme}
      RABBITMQ_SSL_TRUSTSTORE: file:/certs/rabbitmq/client-truststore.p12
      RABBITMQ_SSL_TRUSTSTORE_PASSWORD: ${RABBITMQ_SSL_TRUSTSTORE_PASSWORD:-changeme}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      APP_AUTH_MODE: ${APP_AUTH_MODE:-${AUTH_MODE:-SELF_MANAGEMENT}}
      KEYCLOAK_URL: ${KEYCLOAK_URL:-http://keycloak:8081}
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8081}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-incert}
      KEYCLOAK_JWK_SET_URI: ${KEYCLOAK_JWK_SET_URI:-http://keycloak:8081/realms/incert/protocol/openid-connect/certs}
      KEYCLOAK_SERVICE_CLIENT_ID: ${KEYCLOAK_SERVICE_CLIENT_ID:-ocsp-user-sync}
      KEYCLOAK_SERVICE_CLIENT_SECRET: ${KEYCLOAK_SERVICE_CLIENT_SECRET:-ocsp-user-sync-secret}
      KEYCLOAK_WEBHOOK_SECRET: ${KEYCLOAK_WEBHOOK_SECRET:-incert-keycloak-webhook-secret}
      HSM_ENABLED: "true"
      HSM_MODE: ${HSM_MODE:-DATABASE}
      HSM_ALLOWED_LIBRARY_DIRS: ${HSM_ALLOWED_LIBRARY_DIRS:-/usr/lib/softhsm,/usr/lib/x86_64-linux-gnu/softhsm,/usr/lib/aarch64-linux-gnu/softhsm,/opt/pkcs11j,/opt/hsm,/usr/safenet,/opt/utimaco}
      HSM_KEY_LABEL: ${HSM_KEY_LABEL:-ocsp-signing-key}
      SOFTHSM2_CONF: /etc/softhsm2/softhsm2.conf
    volumes:
      - hsm-tokens:/var/lib/softhsm/tokens
      - hsm-conf:/etc/softhsm2
      - ./certs/rabbitmq:/certs/rabbitmq:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      start_period: 40s
      interval: 10s
      timeout: 5s
      retries: 6

  # ============================================================
  # Keycloak IAM Service (OAuth2 / OIDC Provider for KEYCLOAK mode)
  # ============================================================
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: ocsp-keycloak
    restart: unless-stopped
    networks: [ocsp-net]
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_PORT: 8081
    ports:
      - "8081:8081"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8081 && echo -e 'GET /realms/incert HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK' || exit 1"]
      start_period: 35s
      interval: 10s
      timeout: 5s
      retries: 8
