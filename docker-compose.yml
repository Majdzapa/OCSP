

# =============================================================================
# OCSP Subsystem — Full-stack Docker Compose
# =============================================================================
# One-click startup:
#   docker compose up --build
#
# Services:
#   Infrastructure:
#     mariadb          MariaDB 10.11                  (internal 3306, host 3307)
#     rabbitmq         RabbitMQ 3.13 + management UI  (host 5672, 15672)
#   Application:
#     kms-mock         Mock Key Management Service     (internal 8085)
#     ocsp-auth        Spring Authorization Server     (internal 9000)
#     ocsp-sync        Sync / reconciliation worker    (internal 8081)
#     ocsp-responder   RFC 6960 OCSP endpoint          (host 8080)
#     ocsp-admin-api   Admin REST API                  (host 8082)
#     ocsp-console     React admin dashboard           (host 3000)
#
# Ports exposed to the host:
#   3000  → Admin Console (Nginx serving built React SPA + reverse proxy)
#   8080  → OCSP Responder  (for PKI clients)
#   8082  → Admin API       (direct API access)
#   15672 → RabbitMQ UI     (guest / guest)
#   3307  → MariaDB         (for DB tools like DBeaver)
#
# Credentials (dev-only):
#   MariaDB root:    rootpassword
#   MariaDB app:     ocsp_* / changeme
#   RabbitMQ:        guest / guest
#   OIDC client:     ocsp-console / secret
# =============================================================================

networks:
  ocsp-net:
    driver: bridge

volumes:
  mariadb-data:
  rabbitmq-data:

# ---------------------------------------------------------------------------
# Shared environment fragments (YAML anchors)
# ---------------------------------------------------------------------------
x-db-env: &db-env
  MARIADB_HOST: mariadb
  MARIADB_PORT: 3306
  MARIADB_DB:   ocsp

x-rabbitmq-env: &rabbitmq-env
  RABBITMQ_HOST:     rabbitmq
  RABBITMQ_PORT:     5672
  RABBITMQ_USER:     guest
  RABBITMQ_PASSWORD: guest

x-kms-env: &kms-env
  KMS_BASE_URL:      http://kms-mock:8085
  KMS_MTLS_ENABLED:  "false"

x-spring-opts: &spring-opts
  JAVA_OPTS: >-
    -XX:+UseContainerSupport
    -XX:MaxRAMPercentage=75.0
    -Djava.security.egd=file:/dev/./urandom

services:

  # ============================================================
  # Infrastructure
  # ============================================================

  mariadb:
    image: mariadb:10.11
    container_name: ocsp-mariadb
    restart: unless-stopped
    networks: [ocsp-net]
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_DATABASE:      ocsp
      # Flyway / init scripts create the fine-grained users (ocsp_reader etc.)
      # This user is the bootstrap owner used only by init SQL scripts
      MARIADB_USER:     ocsp_app
      MARIADB_PASSWORD: changeme
    ports:
      - "3307:3306"    # expose to host for DB tools
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 6

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: ocsp-rabbitmq
    restart: unless-stopped
    networks: [ocsp-net]
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"   # Management UI → http://localhost:15672
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 6

  # ============================================================
  # KMS Mock  (must start before all Spring Boot services)
  # ============================================================

  kms-mock:
    build:
      context: .               # repo root — needed for parent pom.xml
      dockerfile: KMS/Dockerfile
    image: ocsp/kms-mock:local
    container_name: ocsp-kms
    restart: unless-stopped
    networks: [ocsp-net]
    environment:
      <<: *spring-opts
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8085/actuator/health || exit 1"]
      start_period: 30s
      interval: 15s
      timeout: 5s
      retries: 5

  # ============================================================
  # OCSP Auth Server (Spring Authorization Server)
  # Issues JWT tokens consumed by the admin console + admin API
  # ============================================================

  ocsp-auth:
    build:
      context: .
      dockerfile: ocsp-auth/Dockerfile
    image: ocsp/auth:local
    container_name: ocsp-auth
    restart: unless-stopped
    networks: [ocsp-net]
    environment:
      <<: *spring-opts
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/actuator/health || exit 1"]
      start_period: 30s
      interval: 15s
      timeout: 5s
      retries: 5

  # ============================================================
  # OCSP Sync Service  (RabbitMQ consumer + reconciliation job)
  # ============================================================

  ocsp-sync:
    build:
      context: .
      dockerfile: ocsp-sync-service/Dockerfile
    image: ocsp/sync:local
    container_name: ocsp-sync
    restart: unless-stopped
    networks: [ocsp-net]
    depends_on:
      mariadb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kms-mock:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      <<: [*db-env, *rabbitmq-env, *kms-env, *spring-opts]
      MARIADB_USER:     ocsp_writer
      MARIADB_PASSWORD: changeme
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/actuator/health || exit 1"]
      start_period: 45s
      interval: 20s
      timeout: 5s
      retries: 5

  # ============================================================
  # OCSP Responder  (RFC 6960 public endpoint)
  # ============================================================

  ocsp-responder:
    build:
      context: .
      dockerfile: ocsp-responder/Dockerfile
    image: ocsp/responder:local
    container_name: ocsp-responder
    restart: unless-stopped
    networks: [ocsp-net]
    depends_on:
      mariadb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kms-mock:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      <<: [*db-env, *rabbitmq-env, *kms-env, *spring-opts]
      MARIADB_USER:       ocsp_reader
      MARIADB_PASSWORD:   changeme
      KMS_OCSP_KEY_REF:   ocsp-signing-key-01
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      start_period: 45s
      interval: 20s
      timeout: 5s
      retries: 5

  # ============================================================
  # OCSP Admin API  (management REST API)
  # ============================================================

  ocsp-admin-api:
    build:
      context: .
      dockerfile: ocsp-admin-api/Dockerfile
    image: ocsp/admin-api:local
    container_name: ocsp-admin-api
    restart: unless-stopped
    networks: [ocsp-net]
    depends_on:
      mariadb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kms-mock:
        condition: service_healthy
      ocsp-auth:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      <<: [*db-env, *rabbitmq-env, *kms-env, *spring-opts]
      MARIADB_USER:        ocsp_admin
      MARIADB_PASSWORD:    changeme
      # OIDC issuer: must be reachable from the browser AND from this container.
      # In Docker, the console proxies /oauth2 → ocsp-auth:9000, so the
      # issuer-uri the admin-api validates against must match what the token says.
      OIDC_ISSUER_URI:     http://localhost:9000
      # Allow requests from the admin console (Nginx on port 3000)
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8082/actuator/health || exit 1"]
      start_period: 45s
      interval: 20s
      timeout: 5s
      retries: 5

  # ============================================================
  # OCSP Console  (React 18 SPA served by Nginx on port 3000)
  # Nginx also reverse-proxies /api → admin-api and /oauth2 → ocsp-auth
  # ============================================================

  ocsp-console:
    build:
      context: ./ocsp-console
      dockerfile: Dockerfile
      args:
        # Baked into the React bundle at build time.
        # /api and /oauth2 routes are relative — Nginx handles the proxy.
        VITE_API_BASE_URL:  ""
        VITE_AUTH_BASE_URL: ""
    image: ocsp/console:local
    container_name: ocsp-console
    restart: unless-stopped
    networks: [ocsp-net]
    depends_on:
      ocsp-admin-api:
        condition: service_healthy
      ocsp-auth:
        condition: service_healthy
    ports:
      - "3000:80"    # ← Admin Console at http://localhost:3000
