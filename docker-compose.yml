# =============================================================================
# Incert OCSP Subsystem — Decoupled Architecture Docker Compose
# Architecture: RabbitMQ + Separated OCSP Responder + Separated OCSP Client + SoftHSM2 (PKCS#11) + KMS Simulator
# =============================================================================
# One-click startup:
#   docker compose up --build -d
#
# Services:
#   mariadb          MariaDB 10.11 (schemas: ocsp, kms) (host 3307, internal 3306)
#   rabbitmq         RabbitMQ 3.13 + Management UI      (host 5672, 15672)
#   kms-simulator    KMS & CA simulator + event outbox  (host 8090, internal 8090)
#   ocsp-responder   RFC 6960 OCSP Responder + Auth    (host 8080, internal 8080)
#   ocsp-client      RFC 6960 Client + Test Web UI      (host 8082, internal 8082)
#   ocsp-console     React 18 Admin Dashboard + Nginx   (host 3000)
# =============================================================================

networks:
  ocsp-net:
    driver: bridge

volumes:
  mariadb-data:
  pki-data:

x-spring-opts: &spring-opts
  JAVA_OPTS: >-
    -XX:+UseContainerSupport
    -XX:MaxRAMPercentage=75.0
    -Djava.security.egd=file:/dev/./urandom

services:

  # ============================================================
  # MariaDB 10.11 (Schemas: ocsp, kms)
  # ============================================================
  mariadb:
    image: mariadb:10.11
    container_name: ocsp-mariadb
    restart: unless-stopped
    networks: [ocsp-net]
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_DATABASE:      ocsp
      MARIADB_USER:          ocsp_app
      MARIADB_PASSWORD:      changeme
    ports:
      - "3307:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 6

  # ============================================================
  # RabbitMQ with Management UI
  # ============================================================
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: ocsp-rabbitmq
    restart: unless-stopped
    networks: [ocsp-net]
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # ============================================================
  # KMS Simulator (Event Source & Test PKI Generator + Frontend)
  # ============================================================
  kms-simulator:
    build:
      context: .
      dockerfile: kms-simulator/Dockerfile
    image: ocsp/kms-simulator:local
    container_name: ocsp-kms
    restart: unless-stopped
    networks: [ocsp-net]
    depends_on:
      mariadb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8090:8090"
    environment:
      <<: *spring-opts
      MARIADB_HOST: mariadb
      MARIADB_PORT: 3306
      MARIADB_KMS_DB: kms
      MARIADB_KMS_USER: kms_app
      MARIADB_KMS_PASSWORD: changeme
      FLYWAY_USER: root
      FLYWAY_PASSWORD: rootpassword
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      KMS_PORT: 8090
      KMS_JOB_REVOCATION_ENABLED: "false"
    volumes:
      - pki-data:/data/pki
      - ./data/pki:/app/data/pki
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8090/actuator/health || exit 1"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 6

  # ============================================================
  # OCSP Responder (RFC 6960 Responder + SoftHSM2 + Auth)
  # ============================================================
  ocsp-responder:
    build:
      context: .
      dockerfile: ocsp-responder/Dockerfile
    image: ocsp/responder:local
    container_name: ocsp-responder
    restart: unless-stopped
    networks: [ocsp-net]
    depends_on:
      mariadb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      <<: *spring-opts
      MARIADB_HOST: mariadb
      MARIADB_PORT: 3306
      MARIADB_DB: ocsp
      MARIADB_USER: ocsp_app
      MARIADB_PASSWORD: changeme
      FLYWAY_USER: root
      FLYWAY_PASSWORD: rootpassword
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      KMS_HOST: kms-simulator
      KMS_PORT: 8090
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: changeme
      ADMIN_API_KEY: incert-admin-secret-key
      HSM_ENABLED: "true"
      HSM_PKCS11_LIBRARY: /usr/lib/softhsm/libsofthsm2.so
      HSM_TOKEN_LABEL: ocsp-signing
      HSM_PIN: "1234"
      HSM_KEY_LABEL: ocsp-signing-key
      PKI_DIR: /data/pki
    volumes:
      - pki-data:/data/pki
      - ./data/pki:/app/data/pki
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      start_period: 40s
      interval: 10s
      timeout: 5s
      retries: 6

  # ============================================================
  # OCSP Client (RFC 6960 Client + Web Test Interface)
  # ============================================================
  ocsp-client:
    build:
      context: .
      dockerfile: ocsp-client/Dockerfile
    image: ocsp/client:local
    container_name: ocsp-client
    restart: unless-stopped
    networks: [ocsp-net]
    depends_on:
      ocsp-responder:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      <<: *spring-opts
      SERVER_PORT: 8082
      OCSP_RESPONDER_URL: http://ocsp-responder:8080/ocsp
      PKI_DIR: /data/pki
    volumes:
      - pki-data:/data/pki
      - ./data/pki:/app/data/pki
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8082/actuator/health || exit 1"]
      start_period: 25s
      interval: 10s
      timeout: 5s
      retries: 6

  # ============================================================
  # OCSP Admin Console (React 18 SPA via Nginx)
  # ============================================================
  ocsp-console:
    build:
      context: ./ocsp-console
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
        VITE_AUTH_BASE_URL: ""
    image: ocsp/console:local
    container_name: ocsp-console
    restart: unless-stopped
    networks: [ocsp-net]
    depends_on:
      ocsp-responder:
        condition: service_healthy
      ocsp-client:
        condition: service_healthy
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/ || exit 1"]
      start_period: 15s
      interval: 10s
      timeout: 5s
      retries: 4
