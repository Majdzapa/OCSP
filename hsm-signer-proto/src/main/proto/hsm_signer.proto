syntax = "proto3";

package incert.hsm.v1;

option java_package = "com.company.incert.hsm.grpc.v1";
option java_multiple_files = true;
option java_outer_classname = "HsmSignerProto";

service HsmSignerService {
  rpc ListProviders(ListProvidersRequest) returns (ListProvidersResponse);
  rpc ListKeys(ListKeysRequest) returns (ListKeysResponse);
  rpc GenerateCsr(GenerateCsrRpcRequest) returns (GenerateCsrRpcResponse);
  rpc ImportCertificate(ImportCertificateRpcRequest) returns (ImportCertificateRpcResponse);
  rpc Sign(SignRpcRequest) returns (SignRpcResponse);
  rpc Health(HealthRpcRequest) returns (HealthRpcResponse);
}

message ListProvidersRequest {}

message ListProvidersResponse {
  string default_provider_id = 1;
  repeated ProviderDescriptor providers = 2;
}

message ProviderDescriptor {
  string provider_id = 1;
  string provider_type = 2;
  string library_path = 3;
  string token_label = 4;
  int64 slot_id = 5;
  bool healthy = 6;
  string status_message = 7;
  repeated KeyDescriptor keys = 8;
}

message KeyDescriptor {
  string key_label = 1;
  string key_algorithm = 2;
  int32 key_size = 3;
}

message ListKeysRequest {
  string provider_id = 1;
}

message ListKeysResponse {
  string provider_id = 1;
  repeated KeyDescriptor keys = 2;
}

message GenerateCsrRpcRequest {
  string provider_id = 1;
  string key_label = 2;
  string subject_dn = 3;
  string key_algorithm = 4;
  int32 key_size = 5;
  bool reuse_existing_key = 6;
}

message GenerateCsrRpcResponse {
  string provider_id = 1;
  string key_label = 2;
  string subject_dn = 3;
  string key_algorithm = 4;
  string csr_pem = 5;
}

message ImportCertificateRpcRequest {
  string provider_id = 1;
  string key_label = 2;
  bytes certificate_der = 3;
}

message ImportCertificateRpcResponse {
  bool imported = 1;
  string message = 2;
}

message SignRpcRequest {
  string provider_id = 1;
  string key_label = 2;
  string signature_algorithm = 3;
  bytes data = 4;
}

message SignRpcResponse {
  bytes signature = 1;
}

message HealthRpcRequest {}

message HealthRpcResponse {
  bool healthy = 1;
  repeated ProviderDescriptor providers = 2;
}

