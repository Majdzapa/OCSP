spring:
  application:
    name: hsm-signer

server:
  port: ${HSM_SIGNER_HTTP_PORT:9091}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always

hsm-signer:
  default-provider-id: ${HSM_DEFAULT_PROVIDER_ID:softhsm-primary}
  grpc:
    port: ${HSM_SIGNER_GRPC_PORT:9090}
    tls:
      enabled: ${HSM_SIGNER_TLS_ENABLED:false}
      key-store: ${HSM_SIGNER_TLS_KEYSTORE:}
      key-store-password: ${HSM_SIGNER_TLS_KEYSTORE_PASSWORD:}
      key-store-type: PKCS12
      trust-store: ${HSM_SIGNER_TLS_TRUSTSTORE:}
      trust-store-password: ${HSM_SIGNER_TLS_TRUSTSTORE_PASSWORD:}
      trust-store-type: PKCS12
      client-auth: ${HSM_SIGNER_TLS_CLIENT_AUTH:true}
  providers:
    - id: softhsm-primary
      enabled: ${HSM_PROVIDER_1_ENABLED:true}
      library-path: ${HSM_PKCS11_LIBRARY:/usr/lib/softhsm/libsofthsm2.so}
      token-label: ${HSM_TOKEN_LABEL:ocsp-signing}
      pin: ${HSM_PIN:1234}
      pool-size: ${HSM_POOL_SIZE:4}
      prehash-in-jvm: ${HSM_PREHASH_IN_JVM:false}
    - id: softhsm-secondary
      enabled: ${HSM_PROVIDER_2_ENABLED:true}
      library-path: ${HSM_SECONDARY_PKCS11_LIBRARY:${HSM_PKCS11_LIBRARY:/usr/lib/softhsm/libsofthsm2.so}}
      token-label: ${HSM_SECONDARY_TOKEN_LABEL:ocsp-signing-2}
      pin: ${HSM_SECONDARY_PIN:${HSM_PIN:1234}}
      pool-size: ${HSM_POOL_SIZE:4}
      prehash-in-jvm: ${HSM_SECONDARY_PREHASH_IN_JVM:false}

