# =============================================================================
# Utimaco CryptoServer / SecurityServer PKCS#11 R3 Client Configuration
# Mounted into ocsp-responder at /opt/utimaco/etc/cs_pkcs11_R3.cfg
# Referenced via environment variable: CS_PKCS11_R3_CFG=/opt/utimaco/etc/cs_pkcs11_R3.cfg
# =============================================================================

[Global]
# Log directory inside the container (/tmp is writable)
Logpath = /tmp
# 0=NONE, 1=ERROR, 2=WARNING, 3=INFO, 4=TRACE
Logging = 1
Logsize = 10mb

# Store keys inside the HSM hardware (never exported externally)
KeysExternal = false

# Allow concurrent PKCS#11 sessions from Pkcs11SessionPool
SlotMultiSession = true

# Keep TCP connection alive to avoid idle disconnects
KeepAlive = true

# Failover / connection timeout in milliseconds
TimeoutConnect = 5000
TimeoutCommand = 30000

# Target Utimaco HSM appliance(s) or SecurityServer Simulator
# Single HSM:   Device = 3001@10.10.1.50
# HA Cluster:   Device = 3001@10.10.1.50;3001@10.10.1.51
# Local cs_sim: Device = 3001@host.docker.internal
Device = 3001@127.0.0.1

