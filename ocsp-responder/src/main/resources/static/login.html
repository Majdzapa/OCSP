<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OCSP Responder — Admin Authentication</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --card-border: #30363d;
      --text-main: #f0f6fc;
      --text-dim: #8b949e;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --orange: #f97316;
      --orange-hover: #ea580c;
      --success: #238636;
      --error: #f85149;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at 50% 20%, #1f293d 0%, var(--bg) 70%);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 2.2rem;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .header {
      text-align: center;
      margin-bottom: 1.8rem;
    }
    .logo-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      border-radius: 12px;
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      font-size: 1.8rem;
      margin-bottom: 0.8rem;
    }
    h1 { font-size: 1.35rem; font-weight: 700; color: #fff; }
    p.sub { font-size: 0.85rem; color: var(--text-dim); margin-top: 0.25rem; }
    .form-group { margin-bottom: 1.2rem; }
    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-dim);
      margin-bottom: 0.4rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    input {
      width: 100%;
      background: #0d1117;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: #fff;
      padding: 0.7rem 0.9rem;
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: var(--accent); }
    .btn {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.75rem;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 0.5rem;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn-kc { background: var(--orange); }
    .btn-kc:hover { background: var(--orange-hover); }
    .alert {
      padding: 0.75rem;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 1.2rem;
      display: none;
    }
    .alert-error {
      background: rgba(248, 81, 73, 0.15);
      border: 1px solid var(--error);
      color: #ff7b72;
    }
    .alert-success {
      background: rgba(35, 134, 54, 0.15);
      border: 1px solid var(--success);
      color: #7ee787;
    }
    .badge {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: 9999px;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .badge-teal { background: rgba(20, 184, 166, 0.15); color: #2dd4bf; border: 1px solid rgba(20, 184, 166, 0.3); }
    .badge-gray { background: rgba(148, 163, 184, 0.15); color: #94a3b8; border: 1px solid rgba(148, 163, 184, 0.3); }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="logo-badge">🛡️</div>
      <h1>OCSP Responder</h1>
      <p class="sub">Sign in to continue</p>
      <div style="margin-top: 0.6rem; display: flex; gap: 0.5rem; justify-content: center;">
        <span id="tlsBadge" class="badge badge-teal">Secure connection (TLS)</span>
      </div>
    </div>

    <div id="alertBox" class="alert"></div>

    <div id="keycloakSection" style="display: none;">
      <button type="button" class="btn btn-kc" onclick="redirectToKeycloak()">Sign in with Keycloak</button>
    </div>

    <form id="loginForm" onsubmit="handleLogin(event)" style="display: none;">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn" id="submitBtn">Sign In</button>
    </form>
  </div>

  <script>
    let authCfg = null;

    async function loadConfig() {
      try {
        const res = await fetch('/api/v1/auth/config');
        if (res.ok) {
          authCfg = await res.json();
          const tlsActive = authCfg.tlsEnabled !== false;
          const badge = document.getElementById('tlsBadge');
          badge.textContent = tlsActive ? 'Secure connection (TLS)' : 'TLS not enabled';
          badge.className = 'badge ' + (tlsActive ? 'badge-teal' : 'badge-gray');

          if (authCfg.isKeycloak) {
            document.getElementById('keycloakSection').style.display = 'block';
          } else {
            document.getElementById('loginForm').style.display = 'block';
          }
        }
      } catch (e) {
        document.getElementById('loginForm').style.display = 'block';
      }
    }

    function redirectToKeycloak() {
      const kc = authCfg && authCfg.keycloak;
      if (!kc || !kc.authServerUrl || !kc.realm || !kc.clientId) {
        showAlert('Keycloak configuration is not available.');
        return;
      }
      const redirectUri = encodeURIComponent(window.location.origin + '/login.html');
      window.location.href =
        kc.authServerUrl + '/realms/' + kc.realm + '/protocol/openid-connect/auth' +
        '?client_id=' + kc.clientId + '&redirect_uri=' + redirectUri +
        '&response_type=token&scope=openid%20profile%20email';
    }

    function showAlert(msg, isSuccess = false) {
      const box = document.getElementById('alertBox');
      box.textContent = msg;
      box.className = 'alert ' + (isSuccess ? 'alert-success' : 'alert-error');
      box.style.display = 'block';
    }

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/v1/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (res.ok && data.authenticated) {
          localStorage.setItem('ocsp_basic_auth', 'Basic ' + btoa(username + ':' + password));
          localStorage.setItem('ocsp_auth_user', data.username || username);
          showAlert('Authenticated as ' + (data.username || username), true);
        } else {
          showAlert(data.message || 'Invalid credentials');
        }
      } catch (err) {
        showAlert('Authentication error: ' + err.message);
      } finally {
        btn.disabled = false;
      }
    }

    loadConfig();
  </script>
</body>
</html>
