<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OCSP Responder — Admin Authentication</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --card-border: #30363d;
      --text-main: #f0f6fc;
      --text-dim: #8b949e;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --success: #238636;
      --error: #f85149;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at 50% 20%, #1f293d 0%, var(--bg) 70%);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 2.2rem;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .header {
      text-align: center;
      margin-bottom: 1.8rem;
    }
    .logo-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      border-radius: 12px;
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      font-size: 1.8rem;
      margin-bottom: 0.8rem;
    }
    h1 { font-size: 1.35rem; font-weight: 700; color: #fff; }
    p.sub { font-size: 0.85rem; color: var(--text-dim); margin-top: 0.25rem; }
    .tabs {
      display: flex;
      border-bottom: 1px solid var(--card-border);
      margin-bottom: 1.5rem;
      gap: 0.5rem;
    }
    .tab-btn {
      flex: 1;
      background: none;
      border: none;
      padding: 0.6rem 0;
      color: var(--text-dim);
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }
    .tab-btn.active {
      color: #fff;
      border-bottom-color: var(--accent);
    }
    .form-group {
      margin-bottom: 1.2rem;
    }
    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-dim);
      margin-bottom: 0.4rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    input {
      width: 100%;
      background: #0d1117;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: #fff;
      padding: 0.7rem 0.9rem;
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: var(--accent); }
    .btn {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.75rem;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 0.5rem;
    }
    .btn:hover { background: var(--accent-hover); }
    .alert {
      padding: 0.75rem;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 1.2rem;
      display: none;
    }
    .alert-error {
      background: rgba(248, 81, 73, 0.15);
      border: 1px solid var(--error);
      color: #ff7b72;
    }
    .alert-success {
      background: rgba(35, 134, 54, 0.15);
      border: 1px solid var(--success);
      color: #7ee787;
    }
    .credentials-hint {
      margin-top: 1.5rem;
      padding: 0.8rem;
      background: rgba(99, 102, 241, 0.08);
      border: 1px solid rgba(99, 102, 241, 0.2);
      border-radius: 8px;
      font-size: 0.78rem;
      color: var(--text-dim);
      line-height: 1.5;
    }
    .credentials-hint code {
      font-family: 'JetBrains Mono', monospace;
      color: #a5b4fc;
      background: rgba(0,0,0,0.3);
      padding: 0.1rem 0.3rem;
      border-radius: 4px;
    }
    .quick-fill {
      color: #818cf8;
      text-decoration: underline;
      cursor: pointer;
    }
    .quick-fill:hover { color: #a5b4fc; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="logo-badge">🛡️</div>
      <h1>OCSP Responder</h1>
      <p class="sub">Admin API Authentication</p>
    </div>

    <div class="tabs">
      <button class="tab-btn active" id="tabCreds" onclick="switchTab('creds')">User Credentials</button>
      <button class="tab-btn" id="tabKey" onclick="switchTab('key')">Admin API Key</button>
    </div>

    <div id="alertBox" class="alert"></div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <!-- Tab 1: Username & Password -->
      <div id="sectionCreds">
        <div class="form-group">
          <label>Admin Username</label>
          <input type="text" id="username" value="admin" autocomplete="username">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" value="changeme" autocomplete="current-password">
        </div>
      </div>

      <!-- Tab 2: API Key -->
      <div id="sectionKey" style="display: none;">
        <div class="form-group">
          <label>X-API-KEY Header Value</label>
          <input type="password" id="apiKey" value="incert-admin-secret-key" autocomplete="off">
        </div>
      </div>

      <button type="submit" class="btn" id="submitBtn">Authenticate & Access Admin</button>
    </form>

    <div class="credentials-hint">
      <strong>Default Credentials:</strong><br>
      • User: <code>admin</code> / <code>changeme</code> (<span class="quick-fill" onclick="fillCreds()">Fill</span>)<br>
      • API Key: <code>incert-admin-secret-key</code> (<span class="quick-fill" onclick="fillKey()">Fill</span>)<br>
      • Web Console: <a href="http://localhost:3000" style="color: #818cf8;">http://localhost:3000</a>
    </div>
  </div>

  <script>
    let currentMode = 'creds';

    function switchTab(mode) {
      currentMode = mode;
      document.getElementById('tabCreds').classList.toggle('active', mode === 'creds');
      document.getElementById('tabKey').classList.toggle('active', mode === 'key');
      document.getElementById('sectionCreds').style.display = mode === 'creds' ? 'block' : 'none';
      document.getElementById('sectionKey').style.display = mode === 'key' ? 'block' : 'none';
      hideAlert();
    }

    function showAlert(msg, isSuccess = false) {
      const box = document.getElementById('alertBox');
      box.textContent = msg;
      box.className = 'alert ' + (isSuccess ? 'alert-success' : 'alert-error');
      box.style.display = 'block';
    }

    function hideAlert() {
      document.getElementById('alertBox').style.display = 'none';
    }

    function fillCreds() {
      switchTab('creds');
      document.getElementById('username').value = 'admin';
      document.getElementById('password').value = 'changeme';
    }

    function fillKey() {
      switchTab('key');
      document.getElementById('apiKey').value = 'incert-admin-secret-key';
    }

    async function handleLogin(e) {
      e.preventDefault();
      hideAlert();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'Verifying...';

      let payload = {};
      if (currentMode === 'creds') {
        payload.username = document.getElementById('username').value.trim();
        payload.password = document.getElementById('password').value;
      } else {
        payload.apiKey = document.getElementById('apiKey').value.trim();
      }

      try {
        const res = await fetch('/api/v1/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (res.ok && data.authenticated) {
          showAlert('Authentication successful! Access granted.', true);
          // Store token in localStorage
          if (data.apiKey) localStorage.setItem('ocsp_api_key', data.apiKey);
          if (data.basicAuth) localStorage.setItem('ocsp_basic_auth', data.basicAuth);
          localStorage.setItem('ocsp_auth_user', data.username);
          
          setTimeout(() => {
            window.location.href = '/api/v1/admin/dashboard/stats';
          }, 800);
        } else {
          showAlert(data.message || 'Invalid credentials or API Key');
        }
      } catch (err) {
        showAlert('Authentication error: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Authenticate & Access Admin';
      }
    }
  </script>
</body>
</html>
