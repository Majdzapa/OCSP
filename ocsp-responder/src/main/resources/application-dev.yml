# =============================================================================
# Development Profile (application-dev.yml)
# All configuration properties for ocsp-responder in development / Docker
# =============================================================================

app:
  auth:
    mode: ${APP_AUTH_MODE:${AUTH_MODE:KEYCLOAK}}
    jwt:
      secret: ${APP_AUTH_JWT_SECRET:incert-dev-jwt-signing-secret-key-change-in-production-32bytes}
      issuer: ${APP_AUTH_JWT_ISSUER:incert-ocsp}
      expiration: ${APP_AUTH_JWT_EXPIRATION:PT8H}

security:
  tls:
    enabled: ${SECURITY_TLS_ENABLED:${AUTH_TLS_ENABLED:${TLS_ENABLED:true}}}
    client-cert-auth-enabled: ${SECURITY_TLS_CLIENT_CERT_AUTH_ENABLED:false}
    https-port: ${SECURITY_TLS_HTTPS_PORT:8443}
    key-store: ${SECURITY_TLS_KEYSTORE:}
    key-store-password: ${SECURITY_TLS_KEYSTORE_PASSWORD:}
    key-store-type: ${SECURITY_TLS_KEYSTORE_TYPE:PKCS12}
  cors:
    allowed-origins: ${SECURITY_CORS_ALLOWED_ORIGINS:http://localhost:3002,http://localhost:3000,http://localhost:5173}

rabbitmq:
  tls:
    enabled: ${RABBITMQ_TLS_ENABLED:${security.tls.enabled:true}}
    tls-port: ${RABBITMQ_TLS_PORT:5671}
    plaintext-port: ${RABBITMQ_PLAINTEXT_PORT:5672}

keycloak:
  auth-server-url: ${KEYCLOAK_URL:http://localhost:8081}
  public-url: ${KEYCLOAK_PUBLIC_URL:${keycloak.auth-server-url}}
  realm: ${KEYCLOAK_REALM:incert}
  client-id: ${KEYCLOAK_CLIENT_ID:ocsp-console}
  jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:${keycloak.auth-server-url}/realms/${keycloak.realm}/protocol/openid-connect/certs}
  issuer-uri: ${KEYCLOAK_ISSUER_URI:${keycloak.auth-server-url}/realms/${keycloak.realm}}

spring:
  datasource:
    url: jdbc:mariadb://${MARIADB_HOST:localhost}:${MARIADB_PORT:3307}/${MARIADB_DB:ocsp}
    username: ${MARIADB_USER:ocsp_app}
    password: ${MARIADB_PASSWORD:changeme}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 2
      connection-timeout: 3000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect

  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false
    user: ${FLYWAY_USER:root}
    password: ${FLYWAY_PASSWORD:rootpassword}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5671}
    username: ${RABBITMQ_USERNAME:ocsp_amqp}
    password: ${RABBITMQ_PASSWORD:changeme}
    ssl:
      enabled: ${rabbitmq.tls.enabled:true}
      key-store: ${RABBITMQ_SSL_KEYSTORE:classpath:certs/rabbitmq/client-keystore.p12}
      key-store-password: ${RABBITMQ_SSL_KEYSTORE_PASSWORD:changeme}
      key-store-type: PKCS12
      trust-store: ${RABBITMQ_SSL_TRUSTSTORE:classpath:certs/rabbitmq/client-truststore.p12}
      trust-store-password: ${RABBITMQ_SSL_TRUSTSTORE_PASSWORD:changeme}
      trust-store-type: PKCS12
      verify-hostname: ${RABBITMQ_SSL_VERIFY_HOSTNAME:true}
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 500ms
          multiplier: 2.0
          max-attempts: 3

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${keycloak.jwk-set-uri}
          issuer-uri: ${keycloak.issuer-uri}

admin:
  username: ${ADMIN_USERNAME:admin}
  password: ${ADMIN_PASSWORD:changeme}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, metrics, info
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1.0

ocsp:
  rabbitmq:
    exchange: ${OCSP_RABBITMQ_EXCHANGE:incert.certificate.status}
    queue: ${OCSP_RABBITMQ_QUEUE:ocsp.certificate.status}
    routing-key: ${OCSP_RABBITMQ_ROUTING_KEY:incert.certificate.status.v1}
    dead-letter-exchange: ${OCSP_RABBITMQ_DLX:incert.certificate.status.dlx}
    dead-letter-queue: ${OCSP_RABBITMQ_DLQ:ocsp.certificate.status.dlq}
    reconciliation-manifest-queue: ${OCSP_RABBITMQ_RECONCILIATION_MANIFEST_QUEUE:ocsp.reconciliation.manifest}
    reconciliation-manifest-routing-key: ${OCSP_RABBITMQ_RECONCILIATION_MANIFEST_ROUTING_KEY:incert.reconciliation.manifest.v1}
    reconciliation-request-queue: ${OCSP_RABBITMQ_RECONCILIATION_REQUEST_QUEUE:kms.reconciliation.request}
    reconciliation-request-routing-key: ${OCSP_RABBITMQ_RECONCILIATION_REQUEST_ROUTING_KEY:incert.reconciliation.request.v1}
  responder:
    next-update-window: ${OCSP_NEXT_UPDATE_WINDOW:PT24H}
    max-request-bytes: ${OCSP_MAX_REQUEST_BYTES:10240}
    max-cert-ids: ${OCSP_MAX_CERT_IDS:10}
    max-nonce-octets: ${OCSP_MAX_NONCE_OCTETS:32}
  client:
    default-responder-url: ${OCSP_RESPONDER_URL:http://${OCSP_RESPONDER_HOST:localhost}:${OCSP_RESPONDER_PORT:8080}/ocsp}
    pki-dir: ${PKI_DIR:./data/pki}
    connect-timeout: ${OCSP_CLIENT_CONNECT_TIMEOUT:PT5S}
    read-timeout: ${OCSP_CLIENT_READ_TIMEOUT:PT10S}
  jobs:
    signing-cert-validity:
      enabled: ${OCSP_JOB_SIGNING_CERT_VALIDITY_ENABLED:true}
      cron: "${OCSP_JOB_SIGNING_CERT_VALIDITY_CRON:0 0 0 * * *}"
      alert-threshold-days: ${OCSP_JOB_SIGNING_CERT_ALERT_THRESHOLD_DAYS:3}
    keycloak-reconciliation:
      enabled: ${OCSP_JOB_KEYCLOAK_RECONCILIATION_ENABLED:true}
      cron: "${OCSP_JOB_KEYCLOAK_RECONCILIATION_CRON:0 0 2 * * *}"
    identity-outbox-retry:
      enabled: ${OCSP_JOB_IDENTITY_OUTBOX_RETRY_ENABLED:true}
      fixed-delay-ms: ${OCSP_JOB_IDENTITY_OUTBOX_RETRY_MS:30000}
      max-attempts: ${OCSP_JOB_IDENTITY_OUTBOX_MAX_ATTEMPTS:5}

hsm:
  enabled: ${HSM_ENABLED:true}
  mode: ${HSM_MODE:DATABASE}
  default-provider-id: ${HSM_DEFAULT_PROVIDER_ID:}
  key-label: ${HSM_KEY_LABEL:ocsp-signing-key}
  allowed-library-dirs: ${HSM_ALLOWED_LIBRARY_DIRS:/usr/lib/softhsm,/usr/lib/x86_64-linux-gnu/softhsm,/usr/lib/aarch64-linux-gnu/softhsm,/opt/homebrew/lib/softhsm,/opt/pkcs11j,/opt/hsm,/usr/safenet,/opt/utimaco}

logging:
  level:
    lu.incert.ocsp: INFO
    org.springframework.amqp: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

