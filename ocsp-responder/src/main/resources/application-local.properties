# =============================================================================
# Local Development Profile (run ocsp-responder directly on macOS host)
# Activate with: --spring.profiles.active=local
#   or: mvn -f ocsp-responder/pom.xml spring-boot:run -Dspring-boot.run.profiles=local
# =============================================================================

server.port=8080

# MariaDB (Docker container exposed on localhost:3307)
spring.datasource.url=jdbc:mariadb://localhost:3307/ocsp
spring.datasource.username=ocsp_app
spring.datasource.password=changeme
spring.flyway.user=root
spring.flyway.password=rootpassword

# RabbitMQ (Docker container exposed on localhost:5671 with mTLS)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5671
spring.rabbitmq.username=ocsp_amqp
spring.rabbitmq.password=changeme
rabbitmq.tls.enabled=true
spring.rabbitmq.ssl.verify-hostname=false

# Keycloak (Docker container exposed on localhost:8081)
security.auth-mode=KEYCLOAK
keycloak.auth-server-url=http://localhost:8081
keycloak.public-url=http://localhost:8081

# PKCS#11 SoftHSM2 Local Configuration & Library (bundled in resources/hsm/)
hsm.enabled=true
hsm.pkcs11-library=classpath:hsm/libsofthsm2.so
hsm.token-label=ocsp-signing
hsm.slot-index=0
hsm.pin=1234
hsm.key-label=ocsp-signing-key

# Logging
logging.level.com.company.incert.ocsp=DEBUG
