security:
  auth-mode: ${AUTH_MODE:SELF_MANAGED} # SELF_MANAGED or KEYCLOCK

keycloak:
  auth-server-url: ${KEYCLOAK_URL:http://localhost:8081}
  realm: ${KEYCLOAK_REALM:incert}
  client-id: ${KEYCLOAK_CLIENT_ID:ocsp-console}
  jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:${keycloak.auth-server-url}/realms/${keycloak.realm}/protocol/openid-connect/certs}
  issuer-uri: ${KEYCLOAK_ISSUER_URI:${keycloak.auth-server-url}/realms/${keycloak.realm}}

spring:
  application:
    name: ocsp-responder
  profiles:
    active: dev

  datasource:
    url: jdbc:mariadb://${MARIADB_HOST:localhost}:${MARIADB_PORT:3307}/${MARIADB_DB:ocsp}
    username: ${MARIADB_USER:ocsp_app}
    password: ${MARIADB_PASSWORD:changeme}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 2
      connection-timeout: 3000

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect

  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true
    user: ${FLYWAY_USER:${spring.datasource.username}}
    password: ${FLYWAY_PASSWORD:${spring.datasource.password}}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 500ms
          multiplier: 2.0
          max-attempts: 3

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${keycloak.jwk-set-uri}
          issuer-uri: ${keycloak.issuer-uri}

server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, metrics, info
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1.0

ocsp:
  rabbitmq:
    exchange: incert.certificate.status
    queue: ocsp.certificate.status
    routing-key: incert.certificate.status.v1
    dead-letter-exchange: incert.certificate.status.dlx
    dead-letter-queue: ocsp.certificate.status.dlq
  responder:
    next-update-window: PT24H
  client:
    default-responder-url: http://${OCSP_RESPONDER_HOST:localhost}:${OCSP_RESPONDER_PORT:8080}/ocsp
  reconciliation:
    enabled: true
    cron: "0 0/15 * * * *"

kms:
  url: http://${KMS_HOST:localhost}:${KMS_PORT:8090}
  snapshot:
    url: http://${KMS_HOST:localhost}:${KMS_PORT:8090}/kms/snapshot

hsm:
  enabled: ${HSM_ENABLED:true}
  pkcs11-library: ${HSM_PKCS11_LIBRARY:/usr/lib/softhsm/libsofthsm2.so}
  token-label: ${HSM_TOKEN_LABEL:ocsp-signing}
  slot-index: ${HSM_SLOT_INDEX:0}
  pin: ${HSM_PIN:1234}
  key-label: ${HSM_KEY_LABEL:ocsp-signing-key}
  config-path: ${HSM_CONFIG_PATH:}

logging:
  level:
    com.company.incert.ocsp: INFO
    org.springframework.amqp: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
