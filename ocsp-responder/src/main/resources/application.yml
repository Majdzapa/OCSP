spring:
  application:
    name: ocsp-responder

  datasource:
    url: jdbc:mariadb://${MARIADB_HOST:127.0.0.1}:${MARIADB_PORT:3307}/${MARIADB_DB:ocsp}
    username: ${MARIADB_USER:ocsp_reader}
    password: ${MARIADB_PASSWORD:changeme}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
      idle-timeout: 600000

  jpa:
    hibernate:
      ddl-auto: validate  # Schema is managed by Flyway; never auto-create in prod
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10

  cache:
    type: caffeine

server:
  port: 8080
  # Disable error-detail leakage in production
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, metrics, info
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1.0

# ---- OCSP-specific properties ----
ocsp:
  kms:
    key-reference: ${KMS_OCSP_KEY_REF:ocsp-signing-key-01}
    connect-timeout-ms: 3000
    read-timeout-ms: 5000

  cache:
    l1:
      max-size: 10000
      expire-after-write-minutes: 60

  rabbitmq:
    cache-invalidation-queue: ocsp.cache.invalidate

# ---- KMS declarative HTTP client (Spring @HttpExchange) ----
kms:
  base-url: ${KMS_BASE_URL:http://localhost:8085}
  # Set to true in production and provide truststore/keystore PKCS12 files
  mtls:
    enabled: ${KMS_MTLS_ENABLED:false}
  truststore:
    path: ${KMS_TRUSTSTORE_PATH:file:/opt/ocsp/kms/truststore.p12}
    password: ${KMS_TRUSTSTORE_PASSWORD:changeme}
  keystore:
    path: ${KMS_KEYSTORE_PATH:file:/opt/ocsp/kms/keystore.p12}
    password: ${KMS_KEYSTORE_PASSWORD:changeme}



logging:
  level:
    com.company.ocsp: INFO
    org.springframework.amqp: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
