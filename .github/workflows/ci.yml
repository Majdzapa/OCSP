name: CI

on:
  push:
    branches: ["refactor/monolith-rabbitmq", "main"]
  pull_request:
    branches: ["refactor/monolith-rabbitmq", "main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Java unit tests — one job per module so failures are pinpointed quickly
  # ─────────────────────────────────────────────────────────────────────────────
  test-ocsp-responder:
    name: "Test · ocsp-responder"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      - name: Run unit tests
        run: cd ocsp-responder && mvn test --batch-mode

      - name: Upload Surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-ocsp-responder
          path: ocsp-responder/target/surefire-reports/

  test-kms-simulator:
    name: "Test · kms-simulator"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      - name: Run unit tests
        run: cd kms-simulator && mvn test --batch-mode

      - name: Upload Surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-kms-simulator
          path: kms-simulator/target/surefire-reports/

  test-ocsp-client:
    name: "Test · ocsp-client"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      - name: Run unit tests
        run: cd ocsp-client && mvn test --batch-mode

      - name: Upload Surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-ocsp-client
          path: ocsp-client/target/surefire-reports/

  # ─────────────────────────────────────────────────────────────────────────────
  # Frontend type-check + build
  # ─────────────────────────────────────────────────────────────────────────────
  build-frontend:
    name: "Build · ocsp-console (TypeScript + Vite)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ocsp-console
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: ocsp-console/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: TypeScript type-check
        run: node_modules/.bin/tsc --noEmit

      - name: Production build
        run: yarn build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ocsp-console-dist
          path: ocsp-console/dist/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # Docker image builds (validate Dockerfiles; no push).
  # The Java Dockerfiles COPY <module>/target/*.jar and use the repo root as build
  # context (see docker-compose.yml), so jars must be packaged first.
  # ─────────────────────────────────────────────────────────────────────────────
  build-docker-images:
    name: "Docker build · all services"
    runs-on: ubuntu-latest
    needs: [test-ocsp-responder, test-kms-simulator, test-ocsp-client, build-frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      - name: Package jars
        run: |
          for m in ocsp-responder kms-simulator ocsp-client; do
            (cd "$m" && mvn package -DskipTests --batch-mode)
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ocsp-responder image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ocsp-responder/Dockerfile
          push: false
          tags: ocsp/responder:ci

      - name: Build kms-simulator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: kms-simulator/Dockerfile
          push: false
          tags: ocsp/kms:ci

      - name: Build ocsp-client image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ocsp-client/Dockerfile
          push: false
          tags: ocsp/client:ci

      - name: Build hsm image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: hsm/Dockerfile
          push: false
          tags: ocsp/hsm:ci

      - name: Build ocsp-console image
        uses: docker/build-push-action@v6
        with:
          context: ./ocsp-console
          file: ocsp-console/Dockerfile
          push: false
          tags: ocsp/console:ci
