# =============================================================================
# Development Profile (application-dev.yml)
# All configuration properties for ocsp-client in development / Docker
# =============================================================================

server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: ocsp-client

ocsp:
  client:
    default-responder-url: ${OCSP_RESPONDER_URL:http://localhost:8080/ocsp}
    pki-dir: ${PKI_DIR:./data/pki}
    connect-timeout: ${OCSP_CLIENT_CONNECT_TIMEOUT:PT5S}
    read-timeout: ${OCSP_CLIENT_READ_TIMEOUT:PT10S}

management:
  endpoints:
    web:
      exposure:
        include: health,info

