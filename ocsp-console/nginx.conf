server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── API reverse proxy ────────────────────────────────────────────────────
    # In Docker, these are proxied to the backend containers on the ocsp-net.
    # VITE_API_BASE_URL / VITE_AUTH_BASE_URL are baked into the React build at
    # build time, but Nginx still needs to proxy the routes when running in the
    # container so the browser can reach the services through a single origin.
    location /api/ {
        proxy_pass http://ocsp-app:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── SPA fallback ─────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Static asset caching ─────────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Security headers ─────────────────────────────────────────────────────
    add_header X-Content-Type-Options  "nosniff"       always;
    add_header X-Frame-Options         "DENY"          always;
    add_header X-XSS-Protection        "1; mode=block" always;
    add_header Referrer-Policy         "strict-origin" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
}
