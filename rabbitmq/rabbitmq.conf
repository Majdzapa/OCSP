# =============================================================================
# Incert OCSP Subsystem — RabbitMQ Mutual TLS (mTLS) Configuration
# Strict mTLS enforced: Plaintext TCP is disabled.
# Only peers with valid certificates signed by Incert RabbitMQ CA can connect.
# =============================================================================

# 1. Disable plaintext AMQP listener completely
listeners.tcp = none

# 2. Enable AMQPS listener on port 5671
listeners.ssl.default = 5671

# 3. TLS Certificates & Keys
ssl_options.cacertfile = /etc/rabbitmq/certs/ca.pem
ssl_options.certfile   = /etc/rabbitmq/certs/server-cert.pem
ssl_options.keyfile    = /etc/rabbitmq/certs/server-key.pem

# 4. Enforce strict mutual TLS (mTLS) & peer certificate verification
ssl_options.verify               = verify_peer
ssl_options.fail_if_no_peer_cert = true
ssl_options.versions.1           = tlsv1.3
ssl_options.versions.2           = tlsv1.2

# 5. Default credentials
default_user = guest
default_pass = guest

# 6. Management HTTP Listener (for Web UI, monitoring, rabbitmqadmin diagnostics)
management.tcp.port = 15672

