spring:
  application:
    name: ocsp-admin-api

  datasource:
    url: jdbc:mariadb://${MARIADB_HOST:127.0.0.1}:${MARIADB_PORT:3307}/${MARIADB_DB:ocsp}
    username: ${MARIADB_USER:ocsp_admin}
    password: ${MARIADB_PASSWORD:changeme}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}

  security:
    oauth2:
      resourceserver:
        jwt:
          # Default: local ocsp-auth dev server (Spring Authorization Server)
          # Production: set OIDC_ISSUER_URI to your Keycloak / IdP issuer
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:9000}

kms:
  base-url: ${KMS_BASE_URL:http://localhost:8085}

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus

ocsp:
  admin:
    cors:
      # Allow both the Vite dev server (5173) and the nginx container (3000)
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

  rabbitmq:
    cache-invalidation-exchange: ocsp.internal
    cache-invalidation-routing-key: ocsp.cache.invalidate

logging:
  level:
    com.company.ocsp: INFO
    org.springframework.security: WARN
