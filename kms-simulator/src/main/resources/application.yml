spring:
  application:
    name: kms-simulator
  profiles:
    active: dev

  datasource:
    url: jdbc:mariadb://${MARIADB_HOST:localhost}:${MARIADB_PORT:3307}/${MARIADB_KMS_DB:kms}
    username: ${MARIADB_KMS_USER:kms_app}
    password: ${MARIADB_KMS_PASSWORD:changeme}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect

  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true
    user: ${FLYWAY_USER:${spring.datasource.username}}
    password: ${FLYWAY_PASSWORD:${spring.datasource.password}}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

server:
  port: ${KMS_PORT:8090}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true

kms:
  rabbitmq:
    exchange: incert.certificate.status
    queue: ocsp.certificate.status
    routing-key: incert.certificate.status.v1
    dead-letter-exchange: incert.certificate.status.dlx
    dead-letter-queue: ocsp.certificate.status.dlq
  outbox:
    relay-delay-ms: 500
  job:
    revocation:
      enabled: ${KMS_JOB_REVOCATION_ENABLED:true}
      cron: "${KMS_JOB_REVOCATION_CRON:0/30 * * * * *}"
      seed: ${KMS_JOB_REVOCATION_SEED:-1}

logging:
  level:
    com.company.incert.kms: INFO
    org.springframework.amqp: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
